# Gold addresses (BACKEND_PLAN.md 4.4). EVALUATION DATA ONLY: the pipeline never reads this file.
#
# DRAFT. Written from data/starter/data/sample_addresses.csv and the corpus text only, never
# from outputs/ (parcels.json, lookups.json). A human must check every entry, ideally with
# the Census Geocoder for the legal city, before the numbers count; until `reviewed_by` is
# set, eval/gold_eval.py labels all numbers "draft gold, unreviewed".
#
# Fields per entry:
#   address_id    from the CSV
#   state         expected state
#   legal_city    "City, ST" | "none" (no corpus city) | "uncertain" (cannot tell without
#                 geocoding; skipped in the city metric) - with city_reason
#   facts         the CSV facts the expectations rely on (copied for the reviewer)
#   results       expected lookup result per gold rule (ids from rules.yaml) on 2026-10-01:
#                 applies | unknown | superseded | not_yet_effective | pending | absent
#                 ("absent" = no row in lookups.json). Optional also_ok: [alternatives].
#
# Reading conventions (CONTRACT.md 7, from the law text):
#   - "certificate of occupancy within the previous 15 years" (Civ. Code 1947.12(d)(4),
#     SDMC 98.0703(k)): D040 gives the rolling rule (built 2006 -> covered from 2021-01-01),
#     so on 2026-10-01 built <= 2011 is covered, built >= 2012 is exempt, missing is unknown.
#   - LA RSO: "first built on or before October 1, 1978" (D041); built 1978 or missing -> unknown.
#   - SF rent increase limits: units first certified after June 13, 1979 are exempt (D079).
#   - Berkeley rent control: multifamily built before 1980 (D009); missing year -> unknown.
#   - A state rent cap is "superseded" where local rent control limits increases to less
#     (1947.12(d)(3)): SF 1.6% (D080), LA RSO.
#   - Rules whose gold status is pending give "pending" for every covered address.
#   - Unit ranges come from `units` or clear `<n>U` tokens in use_description; conflicting or
#     unclear values leave unit-based tests unknown.
