# Gold rules (BACKEND_PLAN.md 4.4). EVALUATION DATA ONLY: the pipeline never reads this file.
#
# DRAFT. Written from the corpus text (data/starter/corpus/text/*.txt) only, never from
# outputs/. A human must check every entry against the source document before the numbers
# count; until `reviewed_by` is set, eval/gold_eval.py labels all numbers
# "draft gold, unreviewed".
#
# Fields per entry:
#   id              stable gold id (never a team_rule_id; ours are renumbered on each verify)
#   source_doc_id   manifest doc id the anchor is copied from
#   jurisdiction    "CA" / "NJ" / "MA" or "City, ST"
#   level           state | city
#   category        one of the 6 schema categories
#   status          expected status on 2026-10-01: in_force | not_yet_effective | pending | failed
#   effective_date  YYYY-MM-DD if the text states or implies one, else null (see note)
#   also_ok         optional {field: [alternative values]} where the text supports more than one reading
#   anchor_quote    verbatim text (>= 20 chars) from source_doc_id; matched by location, whitespace-insensitive
#   also_match      optional [{source_doc_id, anchor_quote}] for the same rule stated in another document
#   key_value       optional headline value; its numbers are compared with ours (info only)
#   basis           where in the text the expectations come from
#   confidence      author's confidence in the entry: high | medium | low
status: draft
reviewed_by: null
reviewed_at: null
as_of: '2026-10-01'
note: >-
  Draft gold set written from the corpus by the team's agent. Every entry must be verified by
  a human against the cited document before any number computed from it is reported as a
  result. Entries with confidence low are the first to check.

