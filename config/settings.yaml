# Pipeline settings. No law facts belong in this file (CLAUDE.md golden rule 1).

default_as_of: "2026-10-01"     # default query date from the participant guide
disclaimer: "Not legal advice."

llm:
  provider: anthropic
  model: claude-sonnet-5-5      # default for every LLM stage (half the per-token price of Opus)
  effort: high                  # output_config.effort; these models reject temperature, so
                                # determinism comes from the disk cache (NOTES.md)
  max_tokens: 32000
  prompt_version: extract_v1
  stages:                       # per-stage overrides; the model is part of the cache key,
    extract:                    # so changing it re-calls every chunk
      model: claude-opus-5-5    # cached full-corpus run (phase 3); switch only after
                                # comparing `make eval` on the 3-doc slice

paths:
  starter: data/starter
  supplement: data/supplement
  manifest: data/starter/corpus/corpus_manifest.csv
  addresses: data/starter/data/sample_addresses.csv
  schema: data/starter/schema/rule_record.schema.json
  change_tests: data/starter/dev/change_tests.json
  cache: cache/llm
  outputs: outputs
  scores: scores
