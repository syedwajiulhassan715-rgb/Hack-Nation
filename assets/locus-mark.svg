<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" fill="none">
  <title>Locus</title>
  <!-- Locus mark: a map pin holding the stack of law over one building
       (the building at the base, the state layer above it, the city layer on top). -->
  <path d="M32 3C18.7 3 8 13.4 8 26.4 8 44.2 32 61 32 61s24-16.8 24-34.6C56 13.4 45.3 3 32 3Z" fill="#111111"/>
  <!-- building -->
  <path d="M24.5 40 32 36.2 39.5 40 32 43.8Z" fill="#F6F2E9"/>
  <path d="M24.5 40v5.2l7.5 3.8v-5.2Z" fill="#d8cfbd"/>
  <path d="M39.5 40v5.2L32 49v-5.2Z" fill="#a89d88"/>
  <!-- state layer -->
  <path d="M32 20.6 47.5 28.4 32 36.2 16.5 28.4Z" fill="#4F7CFF" stroke="#111111" stroke-width="1.6" stroke-linejoin="round"/>
  <!-- city layer -->
  <path d="M32 11.4 45 17.9 32 24.4 19 17.9Z" fill="#2DD4BF" stroke="#111111" stroke-width="1.6" stroke-linejoin="round"/>
</svg>
